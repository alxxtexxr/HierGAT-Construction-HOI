[project]
name = "hiergat-construction-hoi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fire==0.7.1",
    "hydra-core==1.3.2",
    "matplotlib==3.9.4",
    "numcodecs<0.16",  # zarr 2.18.x is incompatible with numcodecs>=0.16
    "numpy==1.26.3",
    "omegaconf==2.3.0",
    "pandas==2.3.2",
    "scikit-learn==1.6.1",
    "scipy==1.13.1",
    "tensorboard==2.20.0",
    "torch==2.7.1",
    "zarr==2.18.2",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
# Linux (GPU server) gets the cu118 build; other platforms (e.g. macOS) fall
# back to PyPI, where torch ships CPU + MPS builds.
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]
